<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="index,follow">
  <title>Contact données personnelles · Amanah</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main>
    <a class="brand" href="./privacy.html"><span class="mark">A</span>Amanah</a>
    <p class="eyebrow">Données personnelles</p>
    <h1>Contacter Amanah</h1>
    <p class="lead">Utilisez ce formulaire pour une demande d’accès ou de rectification. Pour supprimer un compte, utilisez la page dédiée.</p>
    <form id="contact-form" class="card">
      <label for="type">Type de demande</label>
      <select id="type" name="type">
        <option value="privacy">Question sur la confidentialité</option>
        <option value="data_access">Accès ou rectification de mes données</option>
      </select>
      <label for="email">Adresse e-mail</label>
      <input id="email" name="email" type="email" autocomplete="email" required>
      <label for="message">Votre demande</label>
      <textarea id="message" name="message" minlength="10" maxlength="2000" required></textarea>
      <button class="button" type="submit">Envoyer la demande</button>
      <p id="status" class="status" role="status" aria-live="polite"></p>
    </form>
    <p><a class="text-link" href="./account-deletion.html">Demander la suppression d’un compte</a></p>
    <p><a class="text-link" href="./privacy.html">Retour à la politique de confidentialité</a></p>
  </main>
  <script>
    const endpoint = 'https://czfixxogayyfvwqwjlyd.supabase.co/functions/v1/legal/contact';
    const form = document.getElementById('contact-form');
    const status = document.getElementById('status');
    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const button = form.querySelector('button');
      button.disabled = true;
      status.className = 'status';
      status.textContent = 'Envoi en cours…';
      try {
        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: form.email.value.trim(),
            requestType: form.type.value,
            message: form.message.value.trim(),
          }),
        });
        if (!response.ok) throw new Error('La demande n’a pas pu être envoyée.');
        form.reset();
        status.className = 'status success';
        status.textContent = 'Votre demande a été enregistrée.';
      } catch (error) {
        status.className = 'status error';
        status.textContent = error instanceof Error ? error.message : 'Une erreur est survenue.';
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
